mission:
  ros__parameters:
    enable_control: false
    latitude: 0.0
    longitude: 0.0
    relative_altitude: 5.0
    delivery_marker_id: 0
    home_marker_id: 1
    radius: 5.0
    spacing: 2.0
    mission_timeout: 600.0
    phase_timeout: 120.0
    recovery_timeout: 180.0
    min_battery: 0.3
    max_distance: 200.0
px4_adapter:
  ros__parameters:
    enable_control: false
    telemetry_timeout: 2.0
    target_system: 1
vision:
  ros__parameters:
    calibrated: false
    marker_size: 0.4
payload:
  ros__parameters:
    backend: serial
    port: /dev/serial/by-id/CONFIGURE_PAYLOAD
competition:
  ros__parameters:
    enable_control: false
    course_id: table_c_demo
    scan_timeout: 30.0
safety_monitor:
  ros__parameters:
    enable_obstacle_guard: true
    require_obstacle_data: true
    obstacle_clearance: 0.6
    geofence_xy: [-2.0, -3.0, 14.0, -3.0, 14.0, 3.0, -2.0, 3.0]
vio_bridge:
  ros__parameters:
    enabled: true
    min_quality: 50
